name: deploy

on:
  push:
    branches: [main]
  # Until this line existed, no workflow in this repo had a pull_request trigger,
  # so every PR against a PUBLIC production site reported zero checks and could
  # merge without anything ever having built it. That included the dependabot
  # runs that bump the action SHAs in this very file: the first evidence that a
  # bump worked was the deploy it broke. A PR now runs the build half; the deploy
  # job below is gated off pull_request, so nothing a PR does can publish.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the deploy job needs to write Pages, so the write scopes moved down to it.
# With PRs now triggering this workflow, granting them at workflow level would
# hand pages:write and id-token:write to every PR build that has no use for them.
permissions:
  contents: read

concurrency:
  # Per ref, not one shared "pages" group. cancel-in-progress across a single
  # group was safe while only main could trigger this; now that a PR can, a
  # shared group would let opening a PR cancel an in-flight deploy of main.
  # Pushes to main all land in pages-refs/heads/main, so their serialisation
  # is unchanged.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python site/build.py
        env:
          HOSTLAWS_PUBLISHER_ENTITY: hostlaws
          HOSTLAWS_CONTACT: https://github.com/weirdapps/hostlaws/issues
          # Repository variable, not a secret: the code is visible in the page
          # source by design. Unset means no analytics markup is emitted, so
          # the site keeps building before the account exists.
          HOSTLAWS_GOATCOUNTER: ${{ vars.HOSTLAWS_GOATCOUNTER }}
      - name: Fail if the build produced nothing
        run: |
          count=$(find site/dist -name '*.html' | wc -l)
          echo "built $count pages"
          test "$count" -ge 5
          # A crawler that cannot enumerate the pages indexes whichever one it
          # happened to find, so treat these as build products, not extras.
          test -s site/dist/sitemap.xml
          test -s site/dist/robots.txt
          test -s site/dist/og.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/dist

  deploy:
    # A PR proves the site still builds and stops there. Publishing stays on
    # push and workflow_dispatch, exactly as before this workflow saw PRs.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
