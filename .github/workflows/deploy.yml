name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python site/build.py
        env:
          HOSTLAWS_PUBLISHER_ENTITY: hostlaws
          HOSTLAWS_CONTACT: https://github.com/weirdapps/hostlaws/issues
      - name: Fail if the build produced nothing
        run: |
          count=$(find site/dist -name '*.html' | wc -l)
          echo "built $count pages"
          test "$count" -ge 5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
