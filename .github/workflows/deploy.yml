name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python site/build.py
        env:
          HOSTLAWS_PUBLISHER_ENTITY: hostlaws
          HOSTLAWS_CONTACT: https://github.com/weirdapps/hostlaws/issues
          # Repository variable, not a secret: the code is visible in the page
          # source by design. Unset means no analytics markup is emitted, so
          # the site keeps building before the account exists.
          HOSTLAWS_GOATCOUNTER: ${{ vars.HOSTLAWS_GOATCOUNTER }}
      - name: Fail if the build produced nothing
        run: |
          count=$(find site/dist -name '*.html' | wc -l)
          echo "built $count pages"
          test "$count" -ge 5
          # A crawler that cannot enumerate the pages indexes whichever one it
          # happened to find, so treat these as build products, not extras.
          test -s site/dist/sitemap.xml
          test -s site/dist/robots.txt
          test -s site/dist/og.png
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5
