name: prices

on:
  schedule:
    # Daily at 06:00 UTC. Public APIs (Linode, Vultr, Azure, Scaleway)
    # need no credentials. Hetzner and DigitalOcean are skipped when their
    # secrets are absent; the run still succeeds and commits what it fetched.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Fetch live prices
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
        run: uv run python pricing/fetch_live.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/live-prices.json
          if git diff --cached --quiet; then
            echo "No changes to live-prices.json"
          else
            # No [skip ci] here. The push is exactly what triggers deploy.yml,
            # and suppressing it left the published pages frozen at the last
            # human push while this job refreshed the data underneath them:
            # the site promises daily prices and served week-old ones. There
            # is no loop risk, because deploy.yml commits nothing.
            git commit -m "chore: update live-prices.json"
            git push
          fi
