name: prices

on:
  schedule:
    # Daily at 05:43 UTC. Public APIs (Linode, Vultr, Azure, Scaleway)
    # need no credentials. Hetzner and DigitalOcean are skipped when their
    # secrets are absent; the run still succeeds and commits what it fetched.
    # Off the hour on purpose: GitHub delays schedules that fire on the hour,
    # and "0 6" was starting between 10:37 and 12:27 UTC. The minute also
    # avoids the daily Dependabot merges (about 05:20 UTC in summer, 06:20 UTC
    # in winter), which would move main under this job and reject its push.
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # For `gh workflow run deploy.yml` in the last step, and nothing else.
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Fetch live prices
        env:
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
          DIGITALOCEAN_API_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}
        run: uv run python pricing/fetch_live.py

      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/live-prices.json
          if git diff --cached --quiet; then
            echo "No changes to live-prices.json"
          else
            # The push publishes nothing by itself. It is authenticated with
            # GITHUB_TOKEN, and GitHub starts no workflow for a GITHUB_TOKEN
            # push, so deploy.yml's push trigger never fires for it; leaving
            # [skip ci] off the message (2026-08-24) could not change that.
            # workflow_dispatch is one of the two events GITHUB_TOKEN may
            # trigger, hence the explicit dispatch after the push. Without it
            # the site stayed frozen at the last human or Dependabot merge
            # while this job refreshed the data underneath it: the site
            # promises daily prices and served days-old ones. No loop risk,
            # because deploy.yml commits nothing.
            git commit -m "chore: update live-prices.json"
            git push
            gh workflow run deploy.yml --ref main
          fi
